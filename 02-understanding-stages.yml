
trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
    - job: FirstJob
      steps:
      - bash: echo Build First Job
      - bash: echo ${PipelineLevelVariable}
    - job: SecoundJob
      steps:
      - bash: echo Build Secound job
  - stage: DevDeploy
    variables:
      environment: Dev
    dependsOn: Build
    jobs:
    - job: DevDeployJob
      steps:
      - bash: echo $(environment) DevDeployJob

  - stage: QADeploy
    variables:
      environment: QA
    dependsOn: Build
    jobs:
    - job: QADeployJob
      steps:
       - bash: echo $(environment) QADeployJob
  - stage: ProdDeploy
    dependsOn:
    - DevDeploy
    - QADeploy
    jobs:
    - job: ProdDeployJob
      steps:
      - bash: echo ProdDeployJob

